<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиберТренер - Вход</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container animate-pop">
        <div class="auth-card">
            <h1>🛡️ Кибер<span>Тренер</span></h1>
            <p>Вход в систему цифровой безопасности</p>
            <div id="alert-box"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="teacher@school.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Войти в систему</button>
            </form>
            <div class="auth-footer">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const result = login(document.getElementById('email').value, document.getElementById('password').value);
            if (result.success) {
                window.location.href = result.user.role === 'teacher' ? 'teacher.html' : 'student.html';
            } else {
                document.getElementById('alert-box').innerHTML = `<div class="alert alert-error">${result.message}</div>`;
            }
        });
    </script>
</body>
</html>
