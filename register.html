<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиберТренер - Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container animate-pop">
        <div class="auth-card">
            <h1>Регистрация</h1>
            <p>Создайте аккаунт для участия</p>
            <div id="alert-box"></div>
            <form id="register-form">
                <div class="form-group">
                    <label>Имя и Фамилия</label>
                    <input type="text" id="name" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="ivan@school.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" required placeholder="Придумайте надежный пароль">
                </div>
                <div class="form-group">
                    <label>Кто вы?</label>
                    <select id="role" onchange="document.getElementById('student-fields').style.display = this.value === 'student' ? 'block' : 'none'">
                        <option value="student">Ученик</option>
                        <option value="teacher">Учитель</option>
                    </select>
                </div>
                <div id="student-fields">
                    <div class="form-group">
                        <label>Ваш класс</label>
                        <select id="classGrade">
                            <option value="5">5 класс</option><option value="6">6 класс</option>
                            <option value="7">7 класс</option><option value="8">8 класс</option><option value="9">9 класс</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Код группы (выдает учитель)</label>
                        <input type="text" id="groupCode" placeholder="Например: GR123ABC">
                    </div>
                </div>
                <button type="submit" class="btn">Создать аккаунт</button>
            </form>
            <div class="auth-footer">Уже есть аккаунт? <a href="index.html">Войти</a></div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const result = register(
                document.getElementById('name').value,
                document.getElementById('email').value,
                document.getElementById('password').value,
                role,
                role === 'student' ? document.getElementById('classGrade').value : null,
                role === 'student' ? document.getElementById('groupCode').value : null
            );
            if (result.success) {
                document.getElementById('alert-box').innerHTML = `<div class="alert alert-success">✓ Успешно!</div>`;
                setTimeout(() => window.location.href = role === 'teacher' ? 'teacher.html' : 'student.html', 1000);
            } else {
                document.getElementById('alert-box').innerHTML = `<div class="alert alert-error">${result.message}</div>`;
            }
        });
    </script>
</body>
</html>
